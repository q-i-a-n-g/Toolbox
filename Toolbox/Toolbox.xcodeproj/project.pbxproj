ET:-12.3}\"\n  SWIFT_MODULE_CACHE=\"${DERIVED_FILE_DIR}/toolbox_swift_module_cache\"\n  mkdir -p \"${SWIFT_MODULE_CACHE}\"\n  CLANG_MODULE_CACHE_PATH=\"${SWIFT_MODULE_CACHE}\" SWIFT_MODULE_CACHE_PATH=\"${SWIFT_MODULE_CACHE}\" xcrun swiftc -O -module-cache-path \"${SWIFT_MODULE_CACHE}\" -target \"${ARCH}-apple-macos${DEPLOYMENT_TARGET}\" \"${OCR_SWIFT}\" -o \"${OCR_BIN}\"\n  chmod +x \"${OCR_BIN}\"\nfi\n";
